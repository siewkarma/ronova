<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Soundboard</title>
<style>
body {
  background: #222;
  display: flex;
  flex-wrap: wrap;
  justify-content: center;
  align-content: flex-start;
  gap: 20px;
  margin-top: 50px;
}

.sound-btn {
  cursor: pointer;
  width: 250px;
  border-radius: 12px;
  transition: 0.2s;
}

.sound-btn:hover {
  transform: scale(1.05);
}

.back-btn {
  position: fixed;
  top: 16px;
  left: 20px;
  padding: 10px 16px;
  background: #333;
  color: #fff;
  text-decoration: none;
  border-radius: 8px;
  font-family: sans-serif;
  font-size: 14px;
  border: 1px solid #555;
  transition: 0.2s;
  z-index: 10;
}

.back-btn:hover {
  background: #444;
  transform: scale(1.03);
}

</style> 
</head>
<body>
<a href="index.html" class="back-btn">Back to Ronova</a></n>
<img src="67/vody.png" class="sound-btn" onclick="playSound('audio1')">
<img src="67/vesna.png" class="sound-btn" onclick="playSound('audio2')">
<img src="67/yae.png" class="sound-btn" onclick="playSound('audio3')">
<img src="67/icelation.png" class="sound-btn" onclick="playSound('audio4')">
<img src="67/sandrone.png" class="sound-btn" onclick="playSound('audio5')">
<img src="67/columbina.png" class="sound-btn" onclick="playSound('audio6')">


<audio id="audio1" src="67/vody.mp3"></audio>
<audio id="audio2" src="67/vesna.mp3"></audio>
<audio id="audio3" src="67/yae.mp3"></audio>
<audio id="audio4" src="67/icelation.mp3"></audio>
<audio id="audio5" src="67/sandrone.mp3"></audio>
<audio id="audio6" src="67/columbina.mp3"></audio>

<script>
  function playSound(id) {
    // 1. Stop and reset every audio tag on the page
    document.querySelectorAll('audio').forEach(a => {
      a.pause();
      a.currentTime = 0;
    });

    // 2. Play the clicked audio
    const audio = document.getElementById(id);
    audio.play();
  }
</script>


</body>
</html>
